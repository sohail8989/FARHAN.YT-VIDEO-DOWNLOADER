<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro YouTube Player & Downloader</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: #0f0f0f;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 15px;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        header h2 {
            font-size: 20px;
            color: #ff0033;
            margin-bottom: 4px;
        }
        header p {
            font-size: 12px;
            color: #888;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            border-radius: 12px;
            border: 1px solid #333;
            background-color: #1a1a1a;
            color: #fff;
            outline: none;
            font-size: 14px;
        }
        input[type="text"]:focus {
            border-color: #ff0033;
        }
        button.load-btn {
            background-color: #ff0033;
            color: #fff;
            border: none;
            padding: 0 18px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        .player-card {
            background-color: #1a1a1a;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #333;
            display: none;
            margin-bottom: 20px;
        }
        .video-container {
            position: relative;
            width: 100%;
            height: 210px;
            background-color: #000;
        }
        .video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .player-details {
            padding: 15px;
        }
        .player-details h3 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #f1f1f1;
        }
        .action-row {
            display: flex;
            gap: 10px;
        }
        .gallery-download-btn {
            flex: 1;
            background-color: #2ecc71;
            color: #fff;
            padding: 12px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-align: center;
        }
        .loader {
            display: none;
            border: 4px solid #333;
            border-top: 4px solid #ff0033;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 30px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .placeholder-msg {
            text-align: center;
            color: #555;
            margin-top: 50px;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <header>
        <h2><i class="fa-brands fa-youtube"></i> Pro Tube Downloader</h2>
        <p>Video play karein aur direct gallery mein download karein</p>
    </header>

    <div class="search-box">
        <input type="text" id="ytUrlInput" placeholder="YouTube video link paste karein...">
        <button class="load-btn" onclick="loadYouTubeVideo()">Play</button>
    </div>

    <div class="loader" id="spinner"></div>

    <div class="placeholder-msg" id="startMsg">
        <i class="fa-solid fa-film" style="font-size: 30px; margin-bottom: 10px; display:block;"></i>
        Koi bhi YouTube link upar paste karke 'Play' dabayein
    </div>

    <div class="player-card" id="playerCard">
        <div class="video-container" id="videoFrameContainer">
            <!-- YouTube Embedded Player -->
        </div>
        <div class="player-details">
            <h3 id="videoTitleDisplay">YouTube Video Player & Downloader</h3>
            <div class="action-row">
                <a id="directDownloadLink" href="#" class="gallery-download-btn" target="_blank" download>
                    <i class="fa-solid fa-download"></i> Download to Gallery
                </a>
            </div>
        </div>
    </div>

    <script>
        function extractVideoID(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function loadYouTubeVideo() {
            const rawUrl = document.getElementById('ytUrlInput').value.trim();
            const spinner = document.getElementById('spinner');
            const playerCard = document.getElementById('playerCard');
            const startMsg = document.getElementById('startMsg');
            const videoContainer = document.getElementById('videoFrameContainer');
            const downloadBtn = document.getElementById('directDownloadLink');

            if (!rawUrl) {
                alert('Barah-e-karam pehle YouTube link paste karein!');
                return;
            }

            const videoId = extractVideoID(rawUrl);
            if (!videoId) {
                alert('Sahi YouTube link enter karein!');
                return;
            }

            // Loading state
            startMsg.style.display = 'none';
            playerCard.style.display = 'none';
            spinner.style.display = 'block';

            setTimeout(() => {
                spinner.style.display = 'none';

                // 1. YouTube Embedded Video Player load karein (Same like YouTube app)
                videoContainer.innerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
                
                document.getElementById('videoTitleDisplay').innerText = "Now Playing: YouTube Video (ID: " + videoId + ")";

                // 2. Direct fast-download link for saving to phone storage/gallery
                // Using secure high-speed fetch gateway
                downloadBtn.href = `https://loader.to/api/button/?url=${encodeURIComponent(rawUrl)}&f=mp4`;

                playerCard.style.display = 'block';
            }, 800);
        }
    </script>
</body>
</html>
